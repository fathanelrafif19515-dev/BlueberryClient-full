name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          ndk-version: r25c
          build-tools-version: 30.0.3

      # TRICK: KARENA GRADLEW HILANG, KITA BUAT FILE GRADLEW BARU SECARA OTOMATIS
      - name: Generate Missing Gradle Wrapper
        run: |
          cd BlueberryClient
          gradle wrapper --gradle-version 7.4.2

      # JALANKAN BUILD MENGGUNAKAN GRADLEW YANG BARU SAJA DIBUAT DI ATAS
      - name: Build Debug APK
        run: |
          cd BlueberryClient
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
