name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          ndk-version: r25c
          build-tools-version: 30.0.3

      # MENGGUNAKAN JALUR LENGKAP GRADLE VERSi 7.4.2 BAWAAN RUNNER
      - name: Build Debug APK
        run: /opt/gradle/gradle-7.4.2/bin/gradle assembleDebug
        working-directory: ./BlueberryClient

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueberry-client-apk
          path: BlueberryClient/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
