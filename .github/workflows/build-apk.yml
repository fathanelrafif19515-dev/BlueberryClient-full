name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          ndk-version: r25c
          build-tools-version: 30.0.3

      # MEMAKSA SISTEM MENGGUNAKAN GRADLE 7.x BAWAAN RUNNER (MENENTANG VERSI 9.7.0)
      - name: Use Gradle 7
        run: |
          echo "/opt/gradle/gradle-7.6.1/bin" >> $GITHUB_PATH
          echo "Mengarahkan sistem ke Gradle versi lama..."

      # PERINTAH BUILD MENGGUNAKAN GRADLE YANG SUDAH DIKUNCI DI ATAS
      - name: Build Debug APK
        run: gradle assembleDebug
        working-directory: ./BlueberryClient

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueberry-client-apk
          path: BlueberryClient/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
